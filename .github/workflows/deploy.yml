name: Deploy CV to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and prepare static site bundle
        run: |
          set -euo pipefail
          for file in \
            index.html \
            cv-vi.html \
            css/style.css \
            assets/ico/logo.jpg \
            assets/img/avatar.jpg \
            assets/NguyenDuyCuong-CV-EN.pdf \
            assets/NguyenDuyCuong-CV-VI.pdf; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          mkdir -p _site
          cp index.html cv-vi.html _site/
          cp -r assets css _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
